# Transaction-load stress scenario — §6 of CASE_STUDY_DEMO_PLAN.md
# Independent variable: tx arrival rate ×10 (block interval fixed at 1s).
# block_capacity=10 limits each block to 10 txs, forcing saturation when
# tx_arrival_rate=10.0 produces more than 10 txs per block slot.
# All other parameters match the baseline, including churn (~99% uptime).
name: tx_load_stress
num_nodes: 10
block_interval_sec: 1.0
block_jitter_sec: 0.1
mean_latency_ms: 50.0
latency_jitter_ms: 10.0
mean_prop_delay_ms: 100.0
prop_delay_jitter_ms: 20.0
sim_duration_sec: 300.0
max_blocks: 0
seed: 42
output_dir: outputs/runs
peers_per_node: 3
tx_per_block: 10
block_capacity: 10
churn_enabled: true
churn_mean_on_sec: 100.0
churn_mean_off_sec: 1.0
tx_arrival_rate: 10.0
warm_up_blocks: 0
confirmation_depth: 6
settlement_grace_sec: 10.0
