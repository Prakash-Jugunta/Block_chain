# Dynamic network scenario — §6 of CASE_STUDY_DEMO_PLAN.md
# Latency shift at block 150 (~halfway): 50ms → 300ms.
# Pre-shift segment matches baseline exactly (seeds 1–30 shared with baseline).
# "Pre-shift segment matches the baseline exactly" requires churn at baseline levels.
name: dynamic_network
num_nodes: 10
block_interval_sec: 1.0
block_jitter_sec: 0.1
mean_latency_ms: 50.0
latency_jitter_ms: 10.0
mean_prop_delay_ms: 100.0
prop_delay_jitter_ms: 20.0
sim_duration_sec: 300.0
max_blocks: 0
seed: 42
output_dir: outputs/runs
peers_per_node: 3
tx_per_block: 10
churn_enabled: true
churn_mean_on_sec: 100.0
churn_mean_off_sec: 1.0
tx_arrival_rate: 1.0
warm_up_blocks: 0
confirmation_depth: 6
settlement_grace_sec: 10.0
dynamic_events:
  - at_block: 150
    mean_latency_ms: 300.0
    latency_jitter_ms: 30.0
